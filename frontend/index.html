<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>음악 분위기 분석기</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <main>
    <h1>음악 분위기 분석기</h1>
    <p>곡 제목(과 아티스트)을 입력하면 가사와 BPM을 기반으로 분위기를 분석합니다.</p>
    <form id="search-form">
      <input type="text" id="query" placeholder="예: IU Love poem" required />
      <button type="submit">분석하기</button>
    </form>
    <section id="result" hidden>
      <h2 id="result-title"></h2>
      <p id="result-mood"></p>
      <dl>
        <dt>BPM</dt>
        <dd id="result-bpm"></dd>
        <dt>가사 사용 여부</dt>
        <dd id="result-lyrics"></dd>
      </dl>
    </section>
    <p id="error" hidden></p>
  </main>
  <script src="/app.js"></script>
</body>
</html>
