<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>음악 분위기 분석기</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <main>
    <h1>음악 분위기 분석기</h1>
    <p>곡 제목(과 아티스트)을 입력하면 가사와 BPM을 기반으로 분위기를 분석합니다.</p>
    <form id="search-form" autocomplete="off">
      <div class="search-box">
        <input type="text" id="query" placeholder="예: IU Love poem" required />
        <ul id="suggestions" hidden></ul>
      </div>
      <button type="submit">분석하기</button>
    </form>

    <section id="result" hidden>
      <h2 id="result-title"></h2>
      <div class="result-columns">
        <div class="result-left">
          <img id="result-cover" alt="앨범 커버" />
          <audio id="result-audio" controls></audio>
        </div>
        <div class="result-right">
          <svg id="mood-graph" viewBox="0 0 260 260" width="260" height="260" role="img" aria-label="valence-energy 좌표 그래프">
            <circle class="wheel-circle" cx="130" cy="130" r="85" />
            <line class="wheel-axis" x1="45" y1="130" x2="215" y2="130" />
            <line class="wheel-axis" x1="130" y1="45" x2="130" y2="215" />

            <line class="wheel-tick" x1="130" y1="130" x2="215" y2="130" />
            <line class="wheel-tick" x1="130" y1="130" x2="203.6" y2="87.5" />
            <line class="wheel-tick" x1="130" y1="130" x2="172.5" y2="56.4" />
            <line class="wheel-tick" x1="130" y1="130" x2="130" y2="45" />
            <line class="wheel-tick" x1="130" y1="130" x2="87.5" y2="56.4" />
            <line class="wheel-tick" x1="130" y1="130" x2="56.4" y2="87.5" />
            <line class="wheel-tick" x1="130" y1="130" x2="45" y2="130" />
            <line class="wheel-tick" x1="130" y1="130" x2="56.4" y2="172.5" />
            <line class="wheel-tick" x1="130" y1="130" x2="87.5" y2="203.6" />
            <line class="wheel-tick" x1="130" y1="130" x2="130" y2="215" />
            <line class="wheel-tick" x1="130" y1="130" x2="172.5" y2="203.6" />
            <line class="wheel-tick" x1="130" y1="130" x2="203.6" y2="172.5" />

            <text class="wheel-label" x="238" y="130" text-anchor="start" dominant-baseline="middle">행복</text>
            <text class="wheel-label" x="223.5" y="76" text-anchor="start" dominant-baseline="middle">신남</text>
            <text class="wheel-label" x="184" y="36.5" text-anchor="middle" dominant-baseline="middle">열정</text>
            <text class="wheel-label" x="130" y="22" text-anchor="middle" dominant-baseline="middle">긴장</text>
            <text class="wheel-label" x="76" y="36.5" text-anchor="middle" dominant-baseline="middle">분노</text>
            <text class="wheel-label" x="36.5" y="76" text-anchor="end" dominant-baseline="middle">격렬함</text>
            <text class="wheel-label" x="22" y="130" text-anchor="end" dominant-baseline="middle">슬픔</text>
            <text class="wheel-label" x="36.5" y="184" text-anchor="end" dominant-baseline="middle">우울</text>
            <text class="wheel-label" x="76" y="223.5" text-anchor="middle" dominant-baseline="middle">쓸쓸함</text>
            <text class="wheel-label" x="130" y="238" text-anchor="middle" dominant-baseline="middle">평온</text>
            <text class="wheel-label" x="184" y="223.5" text-anchor="middle" dominant-baseline="middle">편안함</text>
            <text class="wheel-label" x="223.5" y="184" text-anchor="start" dominant-baseline="middle">포근함</text>

            <line id="mood-graph-radius" class="wheel-radius" x1="130" y1="130" x2="130" y2="130" />
            <circle id="mood-graph-point" class="wheel-point" cx="130" cy="130" r="6" />
          </svg>
          <p id="result-mood"></p>
          <dl>
            <dt>BPM</dt>
            <dd id="result-bpm"></dd>
            <dt>가사 사용 여부</dt>
            <dd id="result-lyrics"></dd>
          </dl>
        </div>
      </div>
    </section>
    <p id="error" hidden></p>
  </main>
  <script src="/app.js"></script>
</body>
</html>
